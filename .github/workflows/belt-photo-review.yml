name: Conferir procedência das fotos de cinturões
on:
  pull_request:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pesquisar arquivos e baixar amostras para inspeção
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import md5
          from pathlib import Path
          from urllib.parse import urlencode, quote
          from urllib.request import Request, urlopen
          import json
          import re

          output = Path('candidatas-bwf-e-campeonatos')
          output.mkdir()
          ua = 'Wrestling Legacy belt source review/1.0 (BhGoncalves15; public repository)'
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent': ua}), timeout=10) as response:
                  return response.read()

          sources = {
              'wwe-us': 'New US Title.jpg',
              'roh-world-2004': 'ROH World Championship 2004.webp',
              'wwe-undisputed': 'Undisputed WWE Championship.png',
              'wwe-women-2019': 'WrestleMania Axxess 2019 Women\'s championship.jpg',
              'bwf-study': 'Wrestling championship belt.png',
              'nxt-na-original': 'Referee with NXT North American Championship.jpg',
              'world-gold': 'World Championship Belt.jpg',
              'usa-old': 'United states championship (2299446774).jpg',
              'tna-tv-old': 'TNA Television Championship Belt.png',
          }
          for key, file in sources.items():
              name = file.replace(' ', '_')
              hash = md5(name.encode()).hexdigest()
              try:
                  data = fetch(f'https://upload.wikimedia.org/wikipedia/commons/{hash[0]}/{hash[:2]}/{quote(name)}')
                  if not data.startswith(b'<'):
                      (output / (key + Path(name).suffix.lower())).write_bytes(data)
              except Exception as error:
                  print(key, error)

          catalog = Path('src/content/titles.ts').read_text()
          pairs = re.findall(r"(?:singles|team)\('([^']+)', '([^']+)'", catalog)
          def search(pair):
              key, title = pair
              query = 'file: ' + title.replace('Championship', 'championship belt').replace('Campeonato', 'Cinturão')
              args = urlencode({'action': 'query', 'list': 'search', 'srnamespace': 6, 'srlimit': 8,
                                'srsearch': query, 'format': 'json'})
              try:
                  hits = json.loads(fetch('https://commons.wikimedia.org/w/api.php?' + args))['query']['search']
                  return key, [hit['title'] for hit in hits]
              except Exception as error:
                  return key, {'error': str(error)}
          with ThreadPoolExecutor(max_workers=3) as pool:
              results = dict(pool.map(search, pairs))
          (output / 'resultados.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: amostras-para-revisao-dos-cinturoes
          path: candidatas-bwf-e-campeonatos
          retention-days: 3
