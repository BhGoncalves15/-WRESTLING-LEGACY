name: Testes da Carreira Livre

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          PLAYWRIGHT_WEBKIT: '1'
          PLAYWRIGHT_BUILD: '1'
          QA_SCREENSHOTS: 'qa-screenshots'
      - name: Guardar capturas dos navegadores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verificacao-visual
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preparar o pacote da beta
        run: |
          mkdir -p pacote-beta/-WRESTLING-LEGACY
          cp -R dist/. pacote-beta/-WRESTLING-LEGACY/
          cp docs/BETA-CARREIRA-LIVRE.md pacote-beta/COMO-TESTAR.md
      - uses: actions/upload-artifact@v7
        with:
          name: wrestling-legacy-beta
          path: pacote-beta/
          if-no-files-found: error
